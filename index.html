<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subin's p5.js Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a22;
      --border: #2e2e3e;
      --accent: #7c6fff;
      --accent2: #ff6fa8;
      --text-main: #eeeef4;
      --text-sub: #888899;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px 64px;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 48px;
    }

    .eyebrow {
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 600;
      background: linear-gradient(135deg, var(--text-main) 0%, var(--accent) 60%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--text-sub);
      font-weight: 300;
    }

    /* ── Grid ── */
    #projects {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
      max-width: 680px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      cursor: default;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(124, 111, 255, 0.18);
      border-color: var(--accent);
    }

    /* iframe preview */
    .preview {
      position: relative;
      width: 100%;
      /* canvas is 600×400 → ratio 3:2 */
      aspect-ratio: 3 / 2;
      overflow: hidden;
      background: #000;
    }

    .preview iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 600px;
      height: 400px;
      border: none;
      transform-origin: top left;
      /* scaled down to fit cell width (~320px) */
      transform: scale(var(--scale, 0.5));
      pointer-events: none; /* prevent scroll hijack */
    }

    /* card footer */
    .card-info {
      padding: 10px 14px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-top: 1px solid var(--border);
    }

    .badge {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      padding: 2px 8px;
      border-radius: 99px;
      white-space: nowrap;
    }

    .badge.static {
      background: rgba(124, 111, 255, 0.15);
      color: var(--accent);
      border: 1px solid rgba(124, 111, 255, 0.35);
    }

    .badge.dynamic {
      background: rgba(255, 111, 168, 0.15);
      color: var(--accent2);
      border: 1px solid rgba(255, 111, 168, 0.35);
    }

    .card-title {
      font-size: 0.78rem;
      color: var(--text-sub);
      font-weight: 300;
    }

    /* ── Footer ── */
    footer {
      margin-top: 52px;
      font-size: 0.72rem;
      color: var(--text-sub);
      font-family: 'Space Mono', monospace;
      letter-spacing: 0.05em;
    }

    /* Responsive scale adjustment */
    @media (max-width: 520px) {
      #projects {
        grid-template-columns: 1fr 1fr;
        max-width: 100%;
        gap: 12px;
      }
    }
  </style>
</head>
<body>

  <header>
    <p class="eyebrow">p5.js · 2026</p>
    <h1>Subin's Creative Portfolio</h1>
    <p class="subtitle">정적인 추상화부터 인터랙티브 캐릭터까지 — 4개의 과제 작품</p>
  </header>

  <main id="projects">

    <!-- 과제 1 | 과제 4 -->
    <div class="card">
      <div class="preview">
        <iframe src="sample1/index.html" title="과제 1"></iframe>
      </div>
      <div class="card-info">
        <span class="badge static">Static</span>
        <span class="card-title">과제 1 · 추상화 그리기</span>
      </div>
    </div>

    <div class="card">
      <div class="preview">
        <iframe src="sample4/index.html" title="과제 4"></iframe>
      </div>
      <div class="card-info">
        <span class="badge dynamic">Dynamic</span>
        <span class="card-title">과제 4 · 추상화에 움직임 넣기</span>
      </div>
    </div>

    <!-- 과제 2 | 과제 3 -->
    <div class="card">
      <div class="preview">
        <iframe src="sample2/index.html" title="과제 2"></iframe>
      </div>
      <div class="card-info">
        <span class="badge static">Static</span>
        <span class="card-title">과제 2 · 캐리커쳐 그리기</span>
      </div>
    </div>

    <div class="card">
      <div class="preview">
        <iframe src="sample3/index.html" title="과제 3"></iframe>
      </div>
      <div class="card-info">
        <span class="badge dynamic">Dynamic</span>
        <span class="card-title">과제 3 · 움직이는 캐릭터</span>
      </div>
    </div>

  </main>

  <footer>made with p5.js &amp; love · happysubin1114</footer>

  <script>
    // Dynamically set iframe scale based on actual cell width
    function scaleIframes() {
      document.querySelectorAll('.preview').forEach(preview => {
        const w = preview.offsetWidth;
        const scale = w / 600;
        preview.style.setProperty('--scale', scale);
        // Also set the height so aspect-ratio works naturally
        // (aspect-ratio: 3/2 handles this, but we ensure iframe height is right)
        preview.querySelector('iframe').style.transform = `scale(${scale})`;
      });
    }
    scaleIframes();
    window.addEventListener('resize', scaleIframes);
  </script>

</body>
</html>
